<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Normal Blog</title>
    <style>
        body { font-family: sans-serif; margin: 40px; line-height: 1.6; background: #fafafa; color: #333; }
        .container { max-width: 600px; margin: 0 auto; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Welcome to My Blog</h1>
        <p>This is a completely ordinary website about Linux tips and normal computer things. Nothing unusual to see here at all.</p>
    </div>

    <script>
    // Secret Sequence: Up, Up, Down, Down, Left, Right, Left, Right, B, A
    const secretCode = ['ArrowUp', 'ArrowUp', 'ArrowDown', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'ArrowLeft', 'ArrowRight', 'b', 'a'];
    let inputOrder = [];

    window.addEventListener('keydown', (e) => {
        inputOrder.push(e.key);
        inputOrder = inputOrder.slice(-secretCode.length);
        
        if (JSON.stringify(inputOrder) === JSON.stringify(secretCode)) {
            alert("Easter Egg Triggered!");
            // When live, change this to your secret site's actual web URL
            window.location.href = "../secret_site/index.html"; 
        }
    });
    </script>
</body>
</html>
