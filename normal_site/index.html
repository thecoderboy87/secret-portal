<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The coder guys | YouTube Hub</title>
    <style>
        body { 
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; 
            margin: 0; 
            padding: 0; 
            background: #0f0f0f; 
            color: #ffffff; 
            text-align: center;
        }
        .banner {
            padding: 80px 20px;
            background: linear-gradient(135deg, #1f0000 0%, #000000 100%);
            border-bottom: 2px solid #ff0000;
        }
        h1 { margin: 0; font-size: 3.5rem; color: #ffffff; font-weight: 800; }
        .tagline { color: #aaaaaa; font-size: 1.3rem; margin: 10px 0 25px 0; font-weight: 300; }
        .sub-btn {
            display: inline-block;
            background: #ff0000;
            color: #ffffff;
            text-decoration: none;
            padding: 14px 35px;
            font-weight: bold;
            font-size: 1.1rem;
            border-radius: 50px;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 4px 15px rgba(255, 0, 0, 0.3);
        }
        .sub-btn:hover { background: #cc0000; transform: translateY(-3px); box-shadow: 0 6px 20px rgba(255, 0, 0, 0.5); }
        .wrapper { max-width: 900px; margin: 0 auto; padding: 40px 20px; }
        .video-card {
            background: #1a1a1a;
            padding: 30px;
            border-radius: 16px;
            border: 1px solid #2a2a2a;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        h2 { font-size: 1.8rem; margin-top: 0; color: #ff3333; }
    </style>
</head>
<body>

    <div class="banner">
        <h1>The coder guys</h1>
        <p class="tagline">3D Physics Simulations • Linux Engineering • Interactive Code Experiments</p>
        <a href="youtube.com" target="_blank" class="sub-btn">🔴 SUBSCRIBE NOW</a>
    </div>

    <div class="wrapper">
        <div class="video-card">
            <h2>Featured Presentation</h2>
            <p style="color: #bbbbbb; line-height: 1.6;">Check out my video projects tracking graphics developments, rigid body system tests, and full custom coding solutions directly inside production environments.</p>
        </div>
    </div>

    <script>
    const konamiPattern = ['ArrowUp', 'ArrowUp', 'ArrowDown', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'ArrowLeft', 'ArrowRight', 'b', 'a'];
    let userKeystrokes = [];

    window.addEventListener('keydown', (event) => {
        userKeystrokes.push(event.key);
        userKeystrokes = userKeystrokes.slice(-konamiPattern.length);
        
        if (JSON.stringify(userKeystrokes) === JSON.stringify(konamiPattern)) {
            alert("🔒 LINK STABLE: Transferring to Classified Local Network...");
            window.location.href = "../secret_site/index.html"; 
        }
    });
    </script>
</body>
