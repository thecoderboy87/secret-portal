<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The coder guys - YouTube Channel</title>
    <style>
        body { 
            font-family: Roboto, Arial, sans-serif; 
            margin: 0; 
            padding: 0; 
            background: #0f0f0f; 
            color: #ffffff; 
        }
        .navbar {
            background: #0f0f0f;
            padding: 15px 30px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid #222;
        }
        .nav-logo { color: #ff0000; font-size: 1.5rem; font-weight: bold; text-decoration: none; }
        .channel-header {
            max-width: 1100px;
            margin: 30px auto;
            padding: 0 20px;
            display: flex;
            align-items: center;
            gap: 25px;
        }
        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: #282828;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            font-weight: bold;
            color: #aaa;
            border: 2px solid #333;
        }
        .channel-info { text-align: left; }
        .channel-name { margin: 0; font-size: 2.2rem; font-weight: 700; }
        .channel-handle { color: #aaa; margin: 5px 0 15px 0; font-size: 0.95rem; }
        .sub-button {
            background: #f1f1f1;
            color: #0f0f0f;
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: bold;
            text-decoration: none;
            font-size: 0.9rem;
            display: inline-block;
        }
        .sub-button:hover { background: #d9d9d9; }
        .tabs {
            max-width: 1100px;
            margin: 0 auto;
            border-bottom: 1px solid #333;
            padding: 0 20px;
            display: flex;
            gap: 25px;
        }
        .tab { padding: 15px 0; color: #aaa; font-weight: bold; cursor: pointer; border-bottom: 3px solid transparent; }
        .tab.active { color: #fff; border-bottom: 3px solid #fff; }
        .content-section { max-width: 1100px; margin: 30px auto; padding: 0 20px; }
        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
        }
        .video-card { background: #1f1f1f; border-radius: 8px; overflow: hidden; text-align: left; }
        .thumbnail-placeholder {
            width: 100%;
            padding-top: 133.33%; /* 3:4 Shorts aspect ratio */
            background: linear-gradient(180deg, #2a2a2a 0%, #151515 100%);
            position: relative;
        }
        .thumbnail-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ff3333;
            font-size: 0.9rem;
            font-weight: bold;
        }
        .video-details { padding: 12px; }
        .video-title { font-size: 0.95rem; margin: 0 0 5px 0; font-weight: bold; line-height: 1.3; }
        .video-meta { color: #aaa; font-size: 0.8rem; }
    </style>
</head>
<body>

    <div class="navbar">
        <a href="#" class="nav-logo">ViewTube</a>
    </div>

    <div class="channel-header">
        <div class="avatar">THE CODER GUYS</div>
        <div class="channel-info">
            <h1 class="channel-name">The coder guys</h1>
            <div class="channel-handle">@The_coder_guys • Videos & Shorts Hub</div>
            <a href="youtube.com" target="_blank" class="sub-button">Subscribe</a>
        </div>
    </div>

    <div class="tabs">
        <div class="tab">Latest</div>
        <div class="tab active">Shorts</div>
        <div class="tab">About</div>
    </div>

    <div class="content-section">
        <div class="video-grid">
            <!-- Shorts Item 1 -->
            <div class="video-card">
                <div class="thumbnail-placeholder"><div class="thumbnail-text">🚀 LAUNCH</div></div>
                <div class="video-details">
                    <p class="video-title">Rocket Physics Simulation</p>
                    <p class="video-meta">Shorts Feed</p>
                </div>
            </div>
            <!-- Shorts Item 2 -->
            <div class="video-card">
                <div class="thumbnail-placeholder"><div class="thumbnail-text">🧱 BLENDER</div></div>
                <div class="video-details">
                    <p class="video-title">Rigid Body System Test</p>
                    <p class="video-meta">Shorts Feed</p>
                </div>
            </div>
            <!-- Shorts Item 3 -->
            <div class="video-card">
                <div class="thumbnail-placeholder"><div class="thumbnail-text">💻 CODE</div></div>
                <div class="video-details">
                    <p class="video-title">Linux Scripting Guide</p>
                    <p class="video-meta">Shorts Feed</p>
                </div>
            </div>
            <!-- Shorts Item 4 -->
            <div class="video-card">
                <div class="thumbnail-placeholder"><div class="thumbnail-text">🎮 GAMING</div></div>
                <div class="video-details">
                    <p class="video-title">Custom Mod Implementation</p>
                    <p class="video-meta">Shorts Feed</p>
                </div>
            </div>
        </div>
    </div>

    <script>
    const konamiPattern = ['ArrowUp', 'ArrowUp', 'ArrowDown', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'ArrowLeft', 'ArrowRight', 'b', 'a'];
    let userKeystrokes = [];

    window.addEventListener('keydown', (event) => {
        userKeystrokes.push(event.key);
        userKeystrokes = userKeystrokes.slice(-konamiPattern.length);
        
        if (JSON.stringify(userKeystrokes) === JSON.stringify(konamiPattern)) {
            alert("🔒 ACCESS GRANTED: Loading Secret Terminal Network...");
            window.location.href = "../secret_site/index.html"; 
        }
    });
    </script>
</body>
</html>
